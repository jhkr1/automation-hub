services:
  mysql:
    image: mysql:8.4
    container_name: automation-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-automation_hub_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-automation_hub}
      MYSQL_USER: ${MYSQL_USER:-automation_hub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-automation_hub_password}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
